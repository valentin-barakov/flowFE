appId: app.mango.desktop
productName: Mango
electronVersion: 45.2.1
npmRebuild: false
asar: true
afterPack: scripts/after-pack.cjs
directories:
  output: release
files:
  - dist/**
  - package.json
  - build/icon.png
asarUnpack:
  - "**/node_modules/@cursor/sdk-darwin-*/**"
  - "**/*.node"
mac:
  target:
    - target: dir
      arch:
        - arm64
  icon: build/icon.png
  identity: null
  category: public.app-category.developer-tools
